name: Phase 3 Pipeline

on:
  push:
    branches: ['feature/**', 'rollback/**', 'rolback/**']
  pull_request:
    branches: [develop, 'release/**', prod, main]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pipeline-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 00 - Validar a origem e o destino do PR
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            develop:feature/*|release/*:develop|release/*:rollback/*|release/*:rolback/*|prod:release/*|main:prod) ;;
            *) echo "::error::Rota proibida: $HEAD_BRANCH → $BASE_BRANCH. Use feature/* → develop → release/vX.Y.Z → prod → main; rollback/* → release/vX.Y.Z."; exit 1 ;;
          esac
          if [[ "$BASE_BRANCH" == release/* && ! "$BASE_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::A release deve ter formato release/vX.Y.Z'; exit 1
          fi
          if [[ "$HEAD_BRANCH" == release/* && ! "$HEAD_BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::A release deve ter formato release/vX.Y.Z'; exit 1
          fi
      - name: 00 - Validar o nome da branch enviada
        if: github.event_name == 'push'
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_BRANCH" =~ ^(feature|rollback|rolback)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo '::error::Use feature/<descricao> ou rollback/<descricao> (rolback/* também é aceito) em minúsculas.'; exit 1
          fi
      - name: 00 - Explicar a promoção simples para main
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: echo 'prod → main é somente um PR com merge manual; nenhuma esteira de build/deploy é executada.'

  verify:
    name: Verify
    needs: route
    if: >-
      github.event_name == 'push' && startsWith(github.ref_name, 'feature/') ||
      github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'rollback/') &&
      !startsWith(github.event.pull_request.head.ref, 'rolback/') &&
      (github.event.action != 'closed' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 01 - Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.sha }}
      - name: 02 - Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 03 - Dependências
        run: python -m pip install -r requirements.txt coverage
      - name: 04 - Build e testes
        run: python -m unittest discover -s tests -v
      - name: 05 - Cobertura mínima de 90%
        if: github.event_name == 'pull_request'
        run: |
          coverage run --source=codetoken,codeemail -m unittest discover -s tests
          coverage report --fail-under=90
      - name: 06 - Segurança
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: 07 - Observabilidade configurada
        if: github.event_name == 'pull_request'
        run: python .github/scripts/check_observability.py
      - name: 02 - Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: 03 - Formatação Terraform
        run: terraform -chdir=. fmt -check -recursive
      - name: 04 - Build Terraform sem backend remoto
        shell: bash
        run: |
          mkdir -p keys && touch keys/private.pem
          terraform -chdir=. init -backend=false -input=false
          terraform -chdir=. validate
      - name: 05 - Segurança da infraestrutura
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: 06 - Conectividade externa simulada
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'develop'
        run: python .github/scripts/mock_external.py
      - name: 06a - Autenticar na AWS TWM por OIDC
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'develop'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: sa-east-1
          role-to-assume: arn:aws:iam::456687462806:role/fiap-gh-preflight-fiap-lambda
          allowed-account-ids: '456687462806'
      - name: 06b - Confirmar identidade AWS
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'develop'
        run: aws sts get-caller-identity --query Arn --output text

      - name: 07 - Regressão da configuração
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'prod'
        run: terraform -chdir=. validate
      - name: 09 - Regressão dos endpoints Lambda
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'prod'
        run: python -m unittest discover -s tests -v

  propose:
    name: Propose
    needs: [route, verify]
    if: >-
      always() && github.event_name == 'push' && needs.route.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' &&
        (startsWith(github.ref_name, 'rollback/') || startsWith(github.ref_name, 'rolback/'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 10 - Checkout da branch enviada
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 11 - Abrir PR para develop ou release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/flow.py promote

  promote:
    name: Promote
    needs: [route, verify]
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true && needs.route.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' &&
        (startsWith(github.event.pull_request.head.ref, 'rollback/') ||
         startsWith(github.event.pull_request.head.ref, 'rolback/'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 10 - Checkout do automador
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
      - name: 11 - Abrir PR da próxima etapa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/flow.py promote
